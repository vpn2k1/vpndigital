name: TypeScript, Next.js build and browser smoke

on:
  push:
    branches: [feat/ui-refresh-coming-soon]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vpndigital-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve icon library lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit locked Lucide dependency to PR branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ui-refresh-coming-soon'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock lucide-react dependency"
            git push origin HEAD:feat/ui-refresh-coming-soon
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production static build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Desktop/mobile browser checks
        run: |
          python3 -m http.server 4173 --directory out >/tmp/vpndigital-server.log 2>&1 &
          node scripts/ui-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
